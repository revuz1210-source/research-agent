[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "1.0.0"
description = "AI-powered Research Agent for academic and scientific literature tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["research", "AI", "NLP", "literature", "arxiv", "citations"]
dependencies = [
    "openai>=1.14.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["research_agent*"]
